name: QA - Government Premium UI Phase 1
on:
  push:
    branches:
      - feat/government-premium-ui-phase1-20261107
    paths:
      - 'flutter/**'
      - '.github/workflows/qa-government-premium-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Restore Android project
        working-directory: flutter
        run: flutter create --platforms=android --project-name=cikoko .
      - name: Resolve dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Analyze
        working-directory: flutter
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Widget and unit tests
        working-directory: flutter
        run: flutter test
