name: QA - Restore Innovation and Document Reading
on:
  push:
    branches:
      - fix/restore-inovasi-and-document-reading-20261108
    paths:
      - 'flutter/**'
      - '.github/workflows/qa-restore-inovasi-document.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android tooling only (no APK)
        working-directory: flutter
        run: flutter create --platforms=android --project-name=cikoko .
      - name: Resolve dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Analyze code
        working-directory: flutter
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run all widget and unit regression tests
        working-directory: flutter
        run: flutter test --reporter expanded
