name: Documentation - Resident Guide Actual Widget Captures
on:
  push:
    branches: [docs/resident-guide-20261108]
permissions:
  contents: read
jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Use real Roboto fonts and install dependencies
        working-directory: flutter
        run: |
          mkdir -p test_assets
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/Roboto-Regular.ttf" test_assets/
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/Roboto-Bold.ttf" test_assets/ || true
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" test_assets/
          flutter pub get
      - name: Render actual application widgets with illustrative data
        working-directory: flutter
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          p=Path('lib/v211_features.dart')
          s=p.read_text()
          a=s.index('   Widget profileRow(')
          b=s.index('   Widget group(',a)
          block=s[a:b].replace('return ListTile(', 'return Material(type:MaterialType.transparency,child:ListTile(',1)
          block=block.replace('     onTap:onTap,\n    );','     onTap:onTap,\n    ));',1)
          p.write_text(s[:a]+block+s[b:])
          p=Path('lib/premium_ui.dart')
          s=p.read_text()
          a=s.index('class CikokoPremiumSurface')
          b=s.index('\nclass ',a+1)
          block=s[a:b].replace('child: child,','child: Material(type:MaterialType.transparency,child:child),',1)
          p.write_text(s[:a]+block+s[b:])
          for p in Path('lib').glob('*.dart'):
            s=p.read_text()
            s=re.sub(r'(?<![\w])TextStyle\(', "TextStyle(fontFamily:'Roboto',",s)
            p.write_text(s)
          PYTHON
          flutter test test_docs/resident_screens.dart --update-goldens
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resident-guide-actual-screens
          path: flutter/test_docs/screens/*.png
          if-no-files-found: error
          retention-days: 7
