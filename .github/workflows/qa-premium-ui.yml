name: QA - Premium UI and Account Settings
on:
  push:
    branches:
      - fix/newapps-premium-unified-ui-20261105
      - fix/release-hardcheck-ui-20261106
    paths:
      - 'flutter/**'
      - '.github/workflows/qa-premium-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Use compatible Java toolchain and restore Android project
        working-directory: flutter
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          flutter create --platforms=android --project-name=cikoko .
      - name: Resolve dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Analyze source
        working-directory: flutter
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run unit and widget tests
        working-directory: flutter
        run: flutter test
      - name: Build Android test APK (compile every linked screen)
        working-directory: flutter
        run: |
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk
