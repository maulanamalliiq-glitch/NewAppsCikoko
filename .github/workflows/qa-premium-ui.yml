name: QA - Premium UI and Account Settings
on:
  push:
    branches:
      - fix/newapps-premium-unified-ui-20261105
    paths:
      - 'flutter/**'
      - '.github/workflows/qa-premium-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Restore Android project
        working-directory: flutter
        run: flutter create --platforms=android --project-name=cikoko .
      - name: Resolve dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Analyze source
        working-directory: flutter
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run unit and widget tests
        working-directory: flutter
        run: flutter test
