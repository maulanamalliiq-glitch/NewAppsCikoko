name: Cikoko Android 2540 - Emulator Install & Launch Smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-emulator-smoke-2540.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore Android project and build x86_64 debug APK
        working-directory: flutter
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android --project-name=cikoko .
          flutter pub get
          flutter build apk --debug --target-platform android-x64
          test -s build/app/outputs/flutter-apk/app-debug.apk
      - name: Enable Android emulator acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch actual Android app in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            mkdir -p android-smoke
            adb install -r flutter/build/app/outputs/flutter-apk/app-debug.apk
            adb shell pm list packages | grep -F 'com.KelurahanCikoko.malik'
            adb logcat -c
            adb shell monkey -p com.KelurahanCikoko.malik -c android.intent.category.LAUNCHER 1
            sleep 18
            adb shell pidof com.KelurahanCikoko.malik
            adb shell screencap -p /sdcard/cikoko-launch.png
            adb pull /sdcard/cikoko-launch.png android-smoke/cikoko-launch.png
            test -s android-smoke/cikoko-launch.png
            adb logcat -d -v time > android-smoke/startup-logcat.txt
            ! grep -A8 'FATAL EXCEPTION' android-smoke/startup-logcat.txt | grep -F 'Process: com.KelurahanCikoko.malik'
            echo 'PASS: app installed, launched, process running, screenshot captured.'
      - name: Upload smoke screenshot and startup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cikoko-android-emulator-smoke-2540-${{ github.run_number }}
          path: android-smoke/*
          if-no-files-found: warn
          retention-days: 7
