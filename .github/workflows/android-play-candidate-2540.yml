name: Cikoko Android Play Candidate AAB 2546 (main)
on:
  push:
    branches: [main]
    paths:
      - 'flutter/**'
      - '.github/workflows/android-play-candidate-2540.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cikoko-2546-play-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate-aab:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore Android project and check version
        working-directory: flutter
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android --project-name=cikoko .
          grep -q '^version: 2.5.46+2546$' pubspec.yaml
          grep -q 'versionCode = 2546' android/app/build.gradle.kts
          grep -q 'targetSdk = 36' android/app/build.gradle.kts
      - name: Analyze and run all Flutter tests
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Restore protected upload certificate and validate SHA-256
        shell: bash
        env:
          CIKOKO_KEYSTORE_B64: ${{ secrets.CIKOKO_KEYSTORE_B64 }}
          CIKOKO_STORE_PASSWORD: ${{ secrets.CIKOKO_STORE_PASSWORD }}
          CIKOKO_KEY_PASSWORD: ${{ secrets.CIKOKO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CIKOKO_KEYSTORE_B64"
          test -n "$CIKOKO_STORE_PASSWORD"
          test -n "$CIKOKO_KEY_PASSWORD"
          printf '%s' "$CIKOKO_KEYSTORE_B64" | base64 --decode > flutter/android/cikoko_upload.jks
          chmod 600 flutter/android/cikoko_upload.jks
          actual=$(keytool -list -v -keystore flutter/android/cikoko_upload.jks -storepass "$CIKOKO_STORE_PASSWORD" -alias androidkey |
            sed -n 's/.*SHA256: //p' | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          expected="394633E6A2F4C91C150D81B228908562D230D763031A0A0C205618B9D669D4E5"
          test "$actual" = "$expected"
      - name: Build and validate Play upload AAB (not submitted)
        shell: bash
        working-directory: flutter
        env:
          CIKOKO_KEYSTORE_PATH: ${{ github.workspace }}/flutter/android/cikoko_upload.jks
          CIKOKO_STORE_PASSWORD: ${{ secrets.CIKOKO_STORE_PASSWORD }}
          CIKOKO_KEY_PASSWORD: ${{ secrets.CIKOKO_KEY_PASSWORD }}
          CIKOKO_KEY_ALIAS: androidkey
        run: |
          set -euo pipefail
          flutter build appbundle --release
          aab=build/app/outputs/bundle/release/app-release.aab
          test -s "$aab"
          jarsigner -verify "$aab" > /tmp/cikoko-aab-check.log
          grep -q 'jar verified' /tmp/cikoko-aab-check.log
          actual=$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA256: //p' |
            tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          expected="394633E6A2F4C91C150D81B228908562D230D763031A0A0C205618B9D669D4E5"
          test "$actual" = "$expected"
          mkdir -p ../release-candidate
          cp "$aab" ../release-candidate/Cikoko-2546-PLAY-CANDIDATE.aab
          (cd ../release-candidate && sha256sum *.aab > SHA256SUMS.txt)
      - name: Upload AAB candidate for internal review only
        uses: actions/upload-artifact@v4
        with:
          name: cikoko-aab-2546-candidate-${{ github.run_number }}
          path: release-candidate/*
          if-no-files-found: error
          retention-days: 14
      - name: Delete signing keystore after build
        if: always()
        run: rm -f flutter/android/cikoko_upload.jks
