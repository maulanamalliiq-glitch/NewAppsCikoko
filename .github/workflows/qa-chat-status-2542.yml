name: QA Cikoko Chat Status and Visibility 2542
on:
  push:
    branches: [fix/chat-status-visibility-20261108]
    paths:
      - 'flutter/**'
      - '.github/workflows/qa-chat-status-2542.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore Android project
        working-directory: flutter
        run: |
          flutter create --platforms=android --project-name=cikoko .
          flutter pub get
      - name: Analyze Dart and run all Flutter tests including delivery receipts
        working-directory: flutter
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
