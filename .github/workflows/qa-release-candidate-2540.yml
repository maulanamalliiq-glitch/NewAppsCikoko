name: Cikoko v2540 Signed Android Release Candidate
on:
  push:
    branches: [fix/release-hardcheck-ui-20261106]
    paths:
      - 'flutter/**'
      - '.github/workflows/qa-release-candidate-2540.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        format: [apk, aab]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Free runner disk space
        run: |
          for d in /usr/share/dotnet /usr/local/share/powershell /opt/ghc; do
            if [[ -d "$d" ]]; then sudo rm -rf "$d"; fi
          done
      - name: Prepare Flutter / Java17 and check version
        working-directory: flutter
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          flutter create --platforms=android --project-name=cikoko .
          grep -q '^version: 2.5.40+2540$' pubspec.yaml
          grep -q 'versionCode = 2540' android/app/build.gradle.kts
          grep -q 'versionName = "2.5.40"' android/app/build.gradle.kts
          grep -q 'applicationId = "com.KelurahanCikoko.malik"' android/app/build.gradle.kts
          grep -q 'targetSdk = 36' android/app/build.gradle.kts
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Restore and validate existing Play signing certificate
        env:
          CIKOKO_KEYSTORE_B64: ${{ secrets.CIKOKO_KEYSTORE_B64 }}
          CIKOKO_STORE_PASSWORD: ${{ secrets.CIKOKO_STORE_PASSWORD }}
          CIKOKO_KEY_PASSWORD: ${{ secrets.CIKOKO_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CIKOKO_KEYSTORE_B64" || -z "$CIKOKO_STORE_PASSWORD" || -z "$CIKOKO_KEY_PASSWORD" ]]; then
            echo "::error::Signing credentials are required for release candidates."
            exit 1
          fi
          printf '%s' "$CIKOKO_KEYSTORE_B64" | base64 --decode > flutter/android/cikoko_upload.jks
          chmod 600 flutter/android/cikoko_upload.jks
          fingerprint=$(keytool -list -v -keystore flutter/android/cikoko_upload.jks -storepass "$CIKOKO_STORE_PASSWORD" -alias androidkey |
            sed -n 's/.*SHA256: //p' | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$fingerprint" = "394633E6A2F4C91C150D81B228908562D230D763031A0A0C205618B9D669D4E5"
      - name: Build and verify signed package
        working-directory: flutter
        env:
          TARGET_FORMAT: ${{ matrix.format }}
          CIKOKO_KEYSTORE_PATH: ${{ github.workspace }}/flutter/android/cikoko_upload.jks
          CIKOKO_STORE_PASSWORD: ${{ secrets.CIKOKO_STORE_PASSWORD }}
          CIKOKO_KEY_PASSWORD: ${{ secrets.CIKOKO_KEY_PASSWORD }}
          CIKOKO_KEY_ALIAS: androidkey
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../release-candidate
          expected="394633E6A2F4C91C150D81B228908562D230D763031A0A0C205618B9D669D4E5"
          if [[ "$TARGET_FORMAT" == "aab" ]]; then
            flutter build appbundle --release
            source="build/app/outputs/bundle/release/app-release.aab"
            destination="../release-candidate/Cikoko-v2540-PLAY-SIGNED-CANDIDATE.aab"
            test -s "$source"
            jarsigner -verify "$source" > /tmp/jarsigner.log
            grep -q 'jar verified' /tmp/jarsigner.log
            actual=$(keytool -printcert -jarfile "$source" | sed -n 's/^[[:space:]]*SHA256: //p' |
              tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          else
            flutter build apk --release --split-per-abi --target-platform android-arm64
            source="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
            destination="../release-candidate/Cikoko-v2540-PLAY-SIGNED-CANDIDATE-arm64.apk"
            test -s "$source"
            signer="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
            "$signer" verify --verbose --print-certs "$source" > /tmp/apksigner.log
            actual=$(grep -iE 'certificate.*SHA.?256' /tmp/apksigner.log |
              grep -oiE '[0-9a-f]{64}|([0-9a-f]{2}:){31}[0-9a-f]{2}' |
              head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          fi
          test "$actual" = "$expected"
          cp "$source" "$destination"
          test -s "$destination"
      - name: Upload signed QA package
        uses: actions/upload-artifact@v4
        with:
          name: cikoko-2540-${{ matrix.format }}-release-candidate
          path: release-candidate/*
          retention-days: 14
          if-no-files-found: error
      - name: Erase private key
        if: always()
        run: rm -f flutter/android/cikoko_upload.jks
