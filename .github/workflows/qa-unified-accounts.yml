name: QA Six Screenshots
on:
  push:
    branches: [feat/unify-treasurer-staff-accounts-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --project-name=cikoko . && flutter pub get && flutter analyze --no-fatal-infos --no-fatal-warnings && flutter test
        working-directory: flutter
