name: QA - Standalone Login Screen
on:
  push:
    branches: [fix/login-only-entry-no-guest-home-20261107]
    paths:
      - 'flutter/**'
      - '.github/workflows/qa-login-only.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Restore Android project
        working-directory: flutter
        run: flutter create --platforms=android --project-name=cikoko .
      - name: Install dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Analyze code
        working-directory: flutter
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unit and widget tests
        working-directory: flutter
        run: flutter test
